<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercury · PLC数据导入</title><style>
*{box-sizing:border-box}body{margin:0;font:16px 'Microsoft YaHei',sans-serif;color:#314664;background:linear-gradient(120deg,#d7e7fc,#e5f7f3);height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #b9d6ee;background:white;color:#0872b8;border-radius:8px;padding:11px 24px}button.primary{background:#0d70b4;color:white;border-color:#0d70b4}button:hover{filter:brightness(.97)}button:disabled{opacity:.5;cursor:default}header{height:78px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 2px 8px #a8bbcf22}.logo{font:bold italic 29px Georgia;color:#293d7d}.logo small{font:8px Georgia;display:block;text-align:center}header nav{display:flex;gap:12px;align-items:center}header nav button{border:0}.page{height:calc(100vh - 158px);padding:24px}.panel{height:100%;background:#f8fcfcee;border-radius:24px;padding:26px 30px;overflow:auto;box-shadow:0 8px 18px #257bb51a}h2{font-size:24px;font-weight:500;margin:0}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h2:before{content:'';display:inline-block;width:8px;height:23px;background:#2875b3;margin-right:12px;vertical-align:middle}.section{background:#edf3f8;padding:10px 13px;border-left:5px solid #0d70b4;font-size:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 34px}.field label{display:block;margin:0 0 12px}.req{color:#ff6e6e}input,select{border:1px solid #dce5ee;border-radius:4px;background:white;padding:12px;color:#314664;width:100%;outline:none}input:focus,select:focus{border-color:#1884ce}input::placeholder{color:#b7bfcb}.footer{height:80px;display:flex;align-items:center;justify-content:center;gap:28px}.footer button{min-width:190px}.muted{color:#8b98aa;font-size:13px}.note{font-size:13px;color:#72859d;margin-top:12px}.settings{display:grid;grid-template-columns:280px 1fr;gap:22px;height:100%}.sidebar>div,.sidebar>button{background:white;border-radius:20px;margin-bottom:20px;width:100%;padding:25px;border:0;text-align:left;font-size:21px;color:#314664}.sidebar .profile{text-align:center;font-size:28px;padding:20px}.avatar{width:75px;height:75px;border-radius:50%;background:#e3f1fb;color:#1276b7;display:grid;place-items:center;margin:auto auto 10px;font-size:32px}.sidebar button.active{color:#0874b9;box-shadow:inset 4px 0 #0874b9}.tabs{border-bottom:1px solid #e2e9f0;margin:20px 0 24px}.tabs span{display:inline-block;padding:12px 4px;color:#0874b9;border-bottom:3px solid #0874b9}.tools{display:flex;gap:12px;align-items:center;margin-bottom:20px}.tools input{max-width:290px}.tools .muted{margin-left:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:#f0f5fa;text-align:left;color:#647892;font-weight:500}td,th{padding:15px 12px;border-bottom:1px solid #e6edf3}td button{border:0;padding:5px 9px;background:transparent;font-size:14px}.badge{color:#098c76;background:#e5f6f1;border-radius:4px;padding:4px 8px;font-size:12px}.overlay{position:fixed;inset:0;background:#1a304b66;display:flex;align-items:center;justify-content:center;z-index:5;padding:20px;backdrop-filter:blur(2px)}.modal{background:white;border-radius:16px;width:960px;max-width:100%;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 20px 80px #12335444}.mhead{padding:23px 28px;display:flex;justify-content:space-between;border-bottom:1px solid #e6edf3;font-size:21px}.close{border:0;padding:0 5px;color:#8c9bad;font-size:25px}.mbody{padding:22px 28px;overflow:auto}.mfoot{padding:18px 28px;border-top:1px solid #e6edf3;display:flex;justify-content:flex-end;gap:12px}.steps{display:flex;gap:20px;margin-bottom:24px;color:#9aa7b7;font-size:14px}.steps .on{color:#0b75bd}.row{display:flex;gap:16px;align-items:end;margin-bottom:18px}.row .field{flex:1}.row label{font-size:14px;margin-bottom:8px}.sub{font-weight:500;margin:24px 0 14px}.mapping input,.mapping select{padding:8px}.mapping td,.mapping th{padding:9px}.save{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:14px}.save input[type=checkbox]{width:auto}.save input[type=text]{max-width:260px}.info{padding:12px 15px;background:#eff7fd;border-radius:6px;font-size:13px;color:#39759c;margin-bottom:18px}.status{color:#0b957c}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#234564;color:white;padding:14px 26px;border-radius:8px;z-index:9}.empty{text-align:center;padding:60px;color:#8996a6}[hidden]{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.settings{grid-template-columns:190px 1fr}.page{padding:12px}.panel{padding:20px}.sidebar>button{font-size:16px}.row{flex-wrap:wrap}.modal{width:96vw}td,th{padding:10px 6px}}
.steps{justify-content:center;align-items:center}.modal{width:1160px}.mapping{min-width:960px}.mapping td:first-child{width:45px}.mapping input,.mapping select{min-width:65px}.mapping .address{min-width:110px}.tablewrap{overflow:auto}.submenu{background:transparent!important;padding:0 0 0 24px!important;margin-top:-12px}.submenu button{width:100%;border:0;text-align:left;background:#e9f4ff;color:#0874b9}.star{font-size:23px;color:#aab5c3;padding:2px 6px;border:0;background:transparent}.star.on{color:#efa81b}.chartbox{background:#f7fbff;border:1px solid #e0ebf5;border-radius:8px;padding:14px 18px;margin-bottom:16px}.segments{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.segments button{padding:8px 18px;font-size:14px}.segments .selected{background:#e3f1ff;border-color:#147cc1}.trend{width:100%;height:110px;display:block;touch-action:none;cursor:crosshair}.ranges{display:flex;gap:20px;align-items:center;font-size:13px;margin:10px 0}.ranges label{flex:1}.ranges input{padding:0;accent-color:#127cbe}.trendnote{font-size:13px;color:#5982a4}.configName{max-width:520px}.mapping th{white-space:nowrap}input[type=checkbox],input[type=radio]{accent-color:#1378ba}.readonly .mapping input,.readonly .mapping select{background:#f8fafc}.sub span{font-weight:400}button:focus-visible{outline:2px solid #167cba;outline-offset:2px}.system-option{display:flex;align-items:center;gap:18px;width:100%;max-width:570px;padding:24px;text-align:left;border-radius:12px;background:#f7fbff}.system-option strong{font-size:19px;font-weight:500}.protocol-card{border:1px solid #dce7f2;border-radius:10px;background:#f8fbff;margin:4px 0 24px}.protocol-card summary{display:flex;align-items:center;gap:16px;cursor:pointer;padding:16px 20px;list-style:none}.protocol-card summary::-webkit-details-marker{display:none}.protocol-card summary strong{font-size:15px;font-weight:500}.protocol-card summary span{font-size:13px;color:#7c94aa}.chevron{margin-left:auto;font-style:normal;transition:transform .2s}.protocol-card[open] .chevron{transform:rotate(180deg)}.protocol-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:6px 20px 20px}.protocol-fields label>span{display:block;font-size:14px;margin-bottom:9px}.protocol-fields em{color:#e96b6b;font-style:normal}@media(max-width:700px){.protocol-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><header><div class="logo">ϟMercury<small>Sentinel Enabled</small></div><nav><button onclick="go('test')">能效测试</button><button onclick="go('settings')">⚙ 设置</button><span>♧　中　⛶　　● admin⌄</span></nav></header><main class="page"><div id="test" class="panel"><div class="title"><h2>实时运行数据</h2><button class="primary" onclick="openPLC()">↳ PLC导入</button></div><div id="importNote" class="note" hidden></div><div class="section">必填参数 ⓘ</div><div class="grid" id="required"></div><div class="section" style="margin-top:36px">标准参数 ⓘ</div><div class="grid" id="standard"></div></div><div id="settings" class="settings" hidden><aside class="sidebar"><div class="profile"><div class="avatar">♙</div>admin</div><button onclick="placeholder('个人中心')">◉　个人中心　 ›</button><button class="active" onclick="showSystem()">⚙　系统配置　 ›</button><button onclick="placeholder('操作日志')">▤　操作日志　 ›</button><button onclick="placeholder('版本信息')">ⓒ　版本信息　 ›</button></aside><section class="panel" style="background:white"><h2>系统配置</h2><div id="systemOptions" style="margin-top:28px"><button class="system-option" onclick="showRecords()"><span style="font-size:23px">▤</span><span><strong>PLC记录</strong><small style="display:block;margin-top:8px;color:#8b98aa">查看历史接入配置与星标常用配置</small></span><span style="margin-left:auto">›</span></button></div><div id="recordContent" hidden><div class="tabs"><button onclick="showSystem()" style="border:0;padding:10px 0">系统配置</button><span style="border:0;color:#8b98aa;padding:0 12px">/</span><span>PLC记录</span></div><div class="tools"><input id="search" placeholder="搜索配置名称 / 设备地址" oninput="renderRecords()"><button onclick="renderRecords()">查询</button><span class="muted">连接读取成功后自动记录 · 星标常用配置</span></div><table><thead><tr><th>星标</th><th>配置名称</th><th>协议 / 设备地址</th><th>映射字段</th><th>最近使用时间</th><th>操作</th></tr></thead><tbody id="records"></tbody></table><div id="empty" class="empty" hidden>暂无匹配的历史配置，成功连接读取后会自动记录。</div><p class="note">配置保存在本机。此处不保持PLC连接，也不存储连续采集数据。</p></div></section></div></main><footer class="footer" id="footer"><button onclick="go('settings')">退出</button><button onclick="toast('已位于实时运行数据步骤')">上一步</button><button class="primary" onclick="toast('原有自动采集入口保留')">◌ 自动采集</button><button class="primary" onclick="toast('原型演示：测试数据已提交')">提交</button></footer><div class="overlay" id="overlay" hidden><section class="modal"><div class="mhead"><span id="modalTitle">PLC数据导入</span><button class="close" onclick="closePLC()">×</button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></section></div><div class="overlay" id="historyOverlay" hidden style="z-index:7"><section class="modal" style="width:900px"><div class="mhead"><span>导入历史配置</span><button class="close" onclick="closeHistory()">×</button></div><div class="mbody"><div class="tools"><input id="historySearch" placeholder="搜索配置名称 / 设备地址" oninput="renderHistory()"><span class="muted">星标配置优先显示</span></div><table><thead><tr><th>选择</th><th>星标</th><th>配置名称</th><th>协议 / 设备地址</th><th>字段数</th><th>最近使用</th></tr></thead><tbody id="historyRows"></tbody></table><div id="historyEmpty" class="empty" hidden>暂无匹配配置</div></div><div class="mfoot"><button onclick="closeHistory()">取消</button><button class="primary" onclick="importHistory()">使用此配置</button></div></section></div><div class="overlay" id="fillOverlay" hidden style="z-index:8"><section class="modal" style="width:530px"><div class="mhead"><span>确认填入测试数据</span><button class="close" onclick="cancelFill()">×</button></div><div class="mbody"><p id="fillMessage" style="line-height:1.8;margin-top:0"></p><div id="fillSummary" class="info"></div><p class="note">确认后填入所选数据，并断开PLC连接。</p></div><div class="mfoot"><button onclick="cancelFill()">取消</button><button class="primary" onclick="commitFill()">确认填入</button></div></section></div><div id="toast" class="toast" hidden></div>
<script>

const fields=[['实时入口压力','bar',0.21],['实时出口压力','bar',4.85],['实时电流','A',32.6],['实时电压','V',380],['实时转速','rpm',1485],['实时有功功率','kW',18.2],['阀门开度','%',85],['实时介质温度','℃',26.4]];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let configs=JSON.parse(localStorage.getItem('mercury-plc-v2')||localStorage.getItem('mercury-plc-v1')||'null')||[{id:1,name:'一号泵 · 能效测试',protocol:'Modbus TCP',ip:'192.168.1.10',port:'502',unit:'1',time:'2026-10-17 14:20',maps:fields.map((f,i)=>({enabled:i<5,address:String(40001+i*2),type:'Float32',scale:'1'}))}];let current=null,editing=false,connected=false,timer=null,latest=[];let samples=[],readMode='latest',pointIndex=0,rangeStart=0,rangeEnd=0,historyId=null,connectAttempt=0,selectionPinned=false;
function fieldHTML(f,i){return `<div class="field"><label><span class="req">*</span> ${f[0]} (${f[1]})</label><input id="value${i}" placeholder="请输入${f[0]}" type="number" ${i===3?'value="380"':''}></div>`} $('required').innerHTML=fields.slice(0,5).map(fieldHTML).join('');$('standard').innerHTML=[['进口压力传感器高度','m','1.0'],['出口压力传感器高度','m','1.0'],['进口管径','m','0.2'],['出口管径','m','0.2']].map(f=>`<div class="field"><label>${f[0]} (${f[1]})</label><input value="${f[2]}" type="number"></div>`).join('')+fields.slice(5).map((f,i)=>fieldHTML(f,i+5)).join('');
function go(p){$('test').hidden=p!=='test';$('settings').hidden=p!=='settings';$('footer').innerHTML=p==='test'?'<button onclick="go(\'settings\')">退出</button><button onclick="toast(\'已位于实时运行数据步骤\')">上一步</button><button class="primary" onclick="toast(\'原有自动采集入口保留\')">◌ 自动采集</button><button class="primary" onclick="toast(\'原型演示：测试数据已提交\')">提交</button>':'<button onclick="go(\'test\')">⌂ 首页 / 能效测试</button><button onclick="toast(\'原有测试记录入口保留\')">▤ 测试记录</button><button class="primary" onclick="showRecords()">⚙ 设置</button>';if(p==='settings'){$('systemOptions').hidden=false;$('recordContent').hidden=true;renderRecords()}}

configs=configs.map(c=>({...c,starred:!!c.starred,maps:c.maps.map((m,i)=>({...m,scale:m.scale??'1',offset:m.offset??'0',unit:m.unit??fields[i][1],digits:m.digits??'2'}))}));
function showSystem(){go('settings');$('systemOptions').hidden=false;$('recordContent').hidden=true}function showRecords(){go('settings');$('systemOptions').hidden=true;$('recordContent').hidden=false;renderRecords()}function placeholder(n){toast(n+'沿用现有功能，本次展示系统配置中的PLC记录')}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3200)}
function persist(){localStorage.setItem('mercury-plc-v2',JSON.stringify(configs));renderRecords()}
function sortedConfigs(q=''){return configs.filter(c=>(c.name+c.ip+connectionLabel(c)).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>Number(b.starred)-Number(a.starred)||b.time.localeCompare(a.time))}
function starButton(c){return `<button class="star ${c.starred?'on':''}" aria-label="${c.starred?'取消星标':'添加星标'}" onclick="toggleStar(${c.id})">${c.starred?'★':'☆'}</button>`}
function toggleStar(id){const c=configs.find(c=>c.id===id);if(c){c.starred=!c.starred;persist();if(!$('historyOverlay').hidden)renderHistory()}}
function renderRecords(){const list=sortedConfigs($('search').value||'');$('records').innerHTML=list.map(c=>`<tr><td>${starButton(c)}</td><td>${esc(c.name)}</td><td>${esc(c.protocol)}<br><span class="muted">${esc(connectionLabel(c))}</span></td><td>${c.maps.filter(m=>m.enabled).length} 项</td><td>${esc(c.time)}</td><td><button onclick="useConfig(${c.id})">使用</button><button onclick="openPLC(${c.id},true)">查看详情</button><button style="color:#d16a6a" onclick="deleteConfig(${c.id})">删除</button></td></tr>`).join('');$('empty').hidden=!!list.length}
function deleteConfig(id){if(confirm('删除这条历史PLC配置？已填入的测试数据不受影响。')){configs=configs.filter(c=>c.id!==id);persist();toast('历史配置已删除')}}
function useConfig(id){go('test');openPLC(id)}
const protocolSchemas={
        S7:[{key:'rack',label:'机架号',type:'number',value:'0'},{key:'slot',label:'插槽号',type:'number',value:'1'},{key:'timeout',label:'通信超时（ms）',type:'number',value:'3000'},{key:'reconnect',label:'自动重连',type:'radio',options:['启用','停用'],value:'启用'}],
        'Modbus TCP':[{key:'station',label:'站号',type:'number',value:'1'},{key:'timeout',label:'通信超时（ms）',type:'number',value:'3000'},{key:'byteOrder',label:'字节序',type:'radio',options:['ABCD','CDAB','BADC','DCBA'],value:'ABCD'}],
        'Modbus RTU':[{key:'serial',label:'串口',type:'text',value:''},{key:'baud',label:'波特率',type:'select',options:['9600','19200','38400','115200'],value:'9600'},{key:'parity',label:'校验方式',type:'radio',options:['无校验','奇校验','偶校验'],value:'无校验'},{key:'station',label:'站号',type:'number',value:'1'},{key:'timeout',label:'通信超时（ms）',type:'number',value:'3000'}]
      };
      
function protocolValues(c){return Object.fromEntries((protocolSchemas[c.protocol]||[]).map(f=>[f.key,String(c.protocolConfig?.[f.key]??(f.key==='station'?c.unit??f.value:f.value))]))}
function connectionHTML(){const values=protocolValues(current);current.protocolConfig=values;const schema=protocolSchemas[current.protocol];return `<div class="row"><div class="field"><label>协议</label><select id="protocol" onchange="changeProtocol(this.value)">${Object.keys(protocolSchemas).map(p=>`<option ${p===current.protocol?'selected':''}>${p}</option>`).join('')}</select></div><div class="field" style="flex:2"><label>设备地址 *</label><input id="ip" placeholder="例如 192.168.1.10" value="${esc(current.ip)}"></div><div class="field"><label>端口 *</label><input id="port" type="number" value="${esc(current.port)}"></div></div><details id="protocolCard" class="protocol-card" open><summary><strong>协议参数</strong><span>${esc(current.protocol)} · ${schema.length} 项配置</span><i class="chevron">⌄</i></summary><div class="protocol-fields">${schema.map(f=>{const value=values[f.key];let input;if(f.options)input=`<select id="proto-${f.key}">${f.options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else input=`<input id="proto-${f.key}" type="${f.type}" ${f.type==='number'?'min="0" step="1"':''} value="${esc(value)}" ${f.key==='serial'?'placeholder="例如 COM3 或 /dev/ttyUSB0"':''}>`;return `<label><span>${f.label} <em>*</em></span>${input}</label>`}).join('')}</div></details>`}
function captureProtocol(){current.protocolConfig=Object.fromEntries((protocolSchemas[current.protocol]||[]).map(f=>[f.key,$('proto-'+f.key).value]));if(current.protocolConfig.station!==undefined)current.unit=current.protocolConfig.station}
function changeProtocol(protocol){captureDraft();const old=current.protocol;current.protocolDrafts||={};current.protocolDrafts[old]={params:structuredClone(current.protocolConfig),ip:current.ip,port:current.port};current.protocol=protocol;const cached=current.protocolDrafts[protocol];current.protocolConfig=cached?.params||{};current.port=current.port||(protocol==='S7'?'102':'502');renderConfig()}
function validateProtocol(){for(const f of protocolSchemas[current.protocol]){const v=current.protocolConfig[f.key];if(!v?.trim())return '请填写'+f.label;if(f.type==='number'&&(!/^\d+$/.test(v)||!Number.isSafeInteger(+v)))return f.label+'必须是非负整数';if(f.options&&!f.options.includes(v))return '请选择有效的'+f.label;if(f.key==='station'&&+v>255)return '站号范围为0–255';if(f.key==='timeout'&&+v<1)return '通信超时必须大于0'}return ''}
function connectionLabel(c){return c.ip+':'+c.port+(c.protocol==='Modbus RTU'?' · '+(protocolValues(c).serial||'未配置串口'):'')}

function fresh(){return {id:null,name:'',protocol:'Modbus TCP',ip:'',port:'502',unit:'1',maps:fields.map((f,i)=>({enabled:i<5,address:'',type:'Float32',scale:'1',offset:'0',unit:f[1],digits:'2'}))}}
function openPLC(id,view=false){connectAttempt++;clearInterval(timer);connected=false;editing=view;current=structuredClone(configs.find(c=>c.id===id)||fresh());$('overlay').hidden=false;$('modalTitle').textContent=view?'历史PLC配置详情':'PLC数据导入';renderConfig()}
function steps(n){return `<div class="steps"><span class="${n===1?'on':''}">① 配置连接</span><span>────────</span><span class="${n===2?'on':''}">② 核对并填入数据</span></div>`}
function renderConfig(){connected=false;clearInterval(timer);connectAttempt++;$('mbody').innerHTML=`${editing?'':steps(1)}<div class="row"><div class="field configName"><label>配置名称 <span class="req">*</span></label><input id="configName" maxlength="80" placeholder="例如：一号泵 · 能效测试" value="${esc(current.name)}" ${editing?'disabled':''}></div>${editing?'':'<button onclick="openHistory()">导入历史配置</button>'}</div><div class="sub">连接信息</div>${connectionHTML()}<div class="sub">PLC配置明细 <span class="muted">　勾选需要读取的字段</span></div><div class="tablewrap"><table class="mapping"><thead><tr><th>使用</th><th>系统字段</th><th>PLC点位地址</th><th>数据类型</th><th>精度</th><th>偏移</th><th>单位</th><th>保留位数</th></tr></thead><tbody>${fields.map((f,i)=>{const m=current.maps[i];return `<tr><td><input style="width:auto" type="checkbox" id="en${i}" ${m.enabled?'checked':''}></td><td style="white-space:nowrap">${f[0]}</td><td><input class="address" id="addr${i}" placeholder="${current.protocol==='S7'?'如 DB1.DBD'+i*4:'如 '+(40001+i*2)}" value="${esc(m.address)}"></td><td><select id="type${i}">${['Float32','Int16','UInt16','Int32'].map(t=>`<option ${t===m.type?'selected':''}>${t}</option>`).join('')}</select></td><td><input id="scale${i}" type="number" step="any" value="${esc(m.scale)}"></td><td><input id="offset${i}" type="number" step="any" value="${esc(m.offset)}"></td><td><select id="mapunit${i}"><option>${esc(f[1])}</option></select></td><td><input id="digits${i}" type="number" min="0" max="6" step="1" value="${esc(m.digits)}"></td></tr>`}).join('')}</tbody></table></div><p class="note">填入值 = PLC原始值 × 精度 + 偏移；按保留位数处理，单位与系统字段一致。</p><div class="info" style="margin-top:18px">成功连接读取后自动记录配置。相同配置更新最近使用时间；修改后形成新记录，可在「系统配置 → PLC记录」中添加星标。</div><p class="note">原型演示：PLC连接与读数为模拟数据。</p>`;
if(editing){$('mbody').querySelectorAll('input,select').forEach(el=>el.disabled=true);$('mfoot').innerHTML='<button onclick="closePLC()">关闭</button><button class="primary" onclick="editing=false;$(\'modalTitle\').textContent=\'PLC数据导入\';renderConfig()">使用此配置</button>'}else $('mfoot').innerHTML='<button onclick="closePLC()">取消</button><button class="primary" id="connectBtn" onclick="connectPLC()">连接并读取</button>'}
function captureDraft(){current.name=$('configName').value.trim();current.ip=$('ip')?.value.trim()??current.ip;current.port=$('port')?.value??current.port;captureProtocol();current.maps=fields.map((f,i)=>({enabled:$('en'+i).checked,address:$('addr'+i).value.trim(),type:$('type'+i).value,scale:$('scale'+i).value,offset:$('offset'+i).value,unit:$('mapunit'+i).value,digits:$('digits'+i).value}))}
function openHistory(){captureDraft();historyId=null;$('historySearch').value='';$('historyOverlay').hidden=false;renderHistory()}
function closeHistory(){$('historyOverlay').hidden=true}
function renderHistory(){const list=sortedConfigs($('historySearch').value);$('historyRows').innerHTML=list.map(c=>`<tr><td><input type="radio" style="width:auto" name="history" aria-label="选择${esc(c.name)}" ${historyId===c.id?'checked':''} onchange="historyId=${c.id}"></td><td>${starButton(c)}</td><td>${esc(c.name)}</td><td>${esc(c.protocol)}<br><span class="muted">${esc(connectionLabel(c))}</span></td><td>${c.maps.filter(m=>m.enabled).length} 项</td><td>${esc(c.time)}</td></tr>`).join('');$('historyEmpty').hidden=!!list.length}
function importHistory(){const c=configs.find(c=>c.id===historyId);if(!c)return toast('请先选择一条历史配置');current=structuredClone(c);closeHistory();renderConfig();toast('历史配置已带入，可继续调整')}
function collect(){captureDraft();if(!current.name){toast('请输入配置名称');return false}if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(current.ip)||current.ip.split('.').some(n=>Number(n)>255)){toast('请输入有效的设备IPv4地址');return false}if(!/^\d+$/.test(current.port)||+current.port<1||+current.port>65535){toast('请输入有效端口（1–65535）');return false}const protocolError=validateProtocol();if(protocolError){$('protocolCard').open=true;toast(protocolError);return false}if(!current.maps.some(m=>m.enabled)){toast('请至少选择一个字段');return false}if(current.maps.some(m=>m.enabled&&((current.protocol==='S7'?!/^[A-Za-z][A-Za-z0-9_.,:[\]\-]*$/.test(m.address):!/^\d+$/.test(m.address))||m.scale===''||!Number.isFinite(+m.scale)||m.offset===''||!Number.isFinite(+m.offset)||!/^\d+$/.test(m.digits)||+m.digits>6))){toast('请补全点位地址、精度、偏移及保留位数（0–6）');return false}return true}
function signature(c){return JSON.stringify({name:c.name,protocol:c.protocol,ip:c.ip,port:String(c.port),unit:c.protocol==='S7'?'':String(protocolValues(c).station),protocolConfig:protocolValues(c),maps:c.maps.map(m=>({enabled:m.enabled,address:m.address,type:m.type,scale:Number(m.scale),offset:Number(m.offset),unit:m.unit,digits:Number(m.digits)}))})}
function recordHistory(){const match=configs.find(c=>signature(c)===signature(current));const record={...structuredClone(current),id:match?.id??Math.max(Date.now(),...configs.map(c=>Number(c.id)+1)),starred:match?.starred??false,time:new Date().toLocaleString('sv-SE')};if(match)configs[configs.indexOf(match)]=record;else configs.unshift(record);delete record.protocolDrafts;current=structuredClone(record);persist()}
async function connectPLC(){if(!collect())return;const attempt=++connectAttempt;$('connectBtn').disabled=true;$('connectBtn').textContent='正在连接…';await new Promise(r=>setTimeout(r,700));if($('overlay').hidden||attempt!==connectAttempt)return;recordHistory();connected=true;samples=[];readMode='latest';pointIndex=0;rangeStart=0;rangeEnd=0;selectionPinned=false;renderRead()}
function activeFields(){return current.maps.map((m,i)=>m.enabled?i:-1).filter(i=>i>=0)}
function renderRead(){$('mbody').innerHTML=`${steps(2)}<div class="info"><span class="status">● 已连接</span>　${esc(current.name)}　${esc(connectionLabel(current))}<br><span class="muted">配置已自动记录。选择取数方式后核对下方结果，填入完成自动断开连接。</span></div><div class="chartbox"><div class="segments"><button id="mode-latest" onclick="setReadMode('latest')">最新数据</button><button id="mode-point" onclick="setReadMode('point')">指定时间点</button><button id="mode-average" onclick="setReadMode('average')">时段平均值</button><select id="trendField" style="width:190px;padding:7px;margin-left:auto" onchange="drawTrend()">${activeFields().map(i=>`<option value="${i}">${fields[i][0]}</option>`).join('')}</select></div><svg id="trend" class="trend" viewBox="0 0 960 110" role="img" aria-label="本次接入数据趋势，点击选择时间点" onclick="selectChartPoint(event)"></svg><div class="ranges" id="pointControls" hidden><label>时间点 <input id="pointSlider" aria-label="选择时间点" type="range" min="0" max="0" value="0" oninput="pointIndex=+this.value;selectionPinned=true;updateRead()"></label></div><div class="ranges" id="rangeControls" hidden><label>开始时间 <input id="startSlider" aria-label="选择开始时间" type="range" min="0" max="0" value="0" oninput="rangeStart=Math.min(+this.value,rangeEnd);selectionPinned=true;updateRead()"></label><label>结束时间 <input id="endSlider" aria-label="选择结束时间" type="range" min="0" max="0" value="0" oninput="rangeEnd=Math.max(+this.value,rangeStart);selectionPinned=true;updateRead()"></label></div><div class="trendnote" id="selectionNote"></div></div><table><thead><tr><th>系统字段</th><th>点位地址</th><th id="resultHeading">待填入值</th><th>单位</th><th>状态</th></tr></thead><tbody>${activeFields().map(i=>`<tr><td>${fields[i][0]}</td><td>${esc(current.maps[i].address)}</td><td id="read${i}" style="font-size:20px;color:#126fae"></td><td>${esc(current.maps[i].unit)}</td><td><span class="badge">读取正常</span></td></tr>`).join('')}</tbody></table><p class="note" id="readTime"></p><p class="note">趋势仅覆盖本次接入至当前，模拟读数每1秒更新。断开后不保存连续趋势。</p>`;$('mfoot').innerHTML='<button onclick="renderConfig()">返回配置</button><button onclick="closePLC()">取消并断开</button><button class="primary" onclick="fillData()">填入本次测试</button>';sampleTick();timer=setInterval(sampleTick,1000)}
function sampleTick(){if(!connected)return;const values=fields.map((f,i)=>{const raw=f[2]*(1+Math.sin(samples.length*.55+i)*.015);const m=current.maps[i];return raw*Number(m.scale)+Number(m.offset)});samples.push({time:Date.now(),values});if(!selectionPinned){pointIndex=samples.length-1;rangeEnd=samples.length-1}updateRead()}
function setReadMode(mode){readMode=mode;selectionPinned=false;pointIndex=samples.length-1;rangeStart=0;rangeEnd=samples.length-1;updateRead()}
function selectedValues(){if(!samples.length)return [];if(readMode==='latest')return samples.at(-1).values;if(readMode==='point')return samples[pointIndex].values;const selected=samples.slice(rangeStart,rangeEnd+1);return fields.map((_,i)=>selected.reduce((sum,s)=>sum+s.values[i],0)/selected.length)}
function fmtTime(t){return new Date(t).toLocaleTimeString('zh-CN',{hour12:false})}
function updateRead(){if(!samples.length)return;latest=selectedValues();activeFields().forEach(i=>$('read'+i).textContent=latest[i].toFixed(+current.maps[i].digits));['latest','point','average'].forEach(m=>$('mode-'+m).className=m===readMode?'selected':'');$('pointControls').hidden=readMode!=='point';$('rangeControls').hidden=readMode!=='average';[['pointSlider',pointIndex],['startSlider',rangeStart],['endSlider',rangeEnd]].forEach(([id,value])=>{$(id).max=samples.length-1;$(id).value=value});$('resultHeading').textContent=readMode==='average'?'时段平均值':readMode==='point'?'时间点值':'最新值';$('selectionNote').textContent=readMode==='latest'?'最新读数 · '+fmtTime(samples.at(-1).time):readMode==='point'?'指定时间点 · '+fmtTime(samples[pointIndex].time):'平均区间 · '+fmtTime(samples[rangeStart].time)+' — '+fmtTime(samples[rangeEnd].time)+' · '+(rangeEnd-rangeStart+1)+' 个采样点';$('readTime').textContent='本次接入：'+fmtTime(samples[0].time)+'　最近读取：'+fmtTime(samples.at(-1).time);drawTrend()}
function drawTrend(){if(!samples.length)return;const i=+$('trendField').value,values=samples.map(s=>s.values[i]);const lo=Math.min(...values),hi=Math.max(...values),span=hi-lo||Math.abs(hi)*.02||1;const x=n=>40+n/Math.max(1,samples.length-1)*900,y=v=>80-(v-lo)/span*55;const start=readMode==='average'?rangeStart:readMode==='point'?pointIndex:samples.length-1,end=readMode==='average'?rangeEnd:start;const poly=values.map((v,n)=>`${x(n)},${y(v)}`).join(' ');$('trend').innerHTML=`<path d="M40 12V90H940" fill="none" stroke="#d5e3ef"/>${readMode==='average'?`<rect x="${x(start)}" y="8" width="${Math.max(2,x(end)-x(start))}" height="80" fill="#187dbe18"/>`:''}<polyline points="${poly}" fill="none" stroke="#1685cb" stroke-width="2.5"/><line x1="${x(start)}" x2="${x(start)}" y1="8" y2="90" stroke="#1685cb" stroke-dasharray="3 3"/>${readMode==='average'?`<line x1="${x(end)}" x2="${x(end)}" y1="8" y2="90" stroke="#1685cb"/>`:''}<circle cx="${x(end)}" cy="${y(values[end])}" r="4" fill="#1685cb"/><text x="40" y="107" fill="#8396aa" font-size="11">${fmtTime(samples[0].time)}</text><text x="940" y="107" text-anchor="end" fill="#8396aa" font-size="11">${fmtTime(samples.at(-1).time)}</text><text x="2" y="20" fill="#8396aa" font-size="10">${hi.toFixed(+current.maps[i].digits)}</text><text x="2" y="82" fill="#8396aa" font-size="10">${lo.toFixed(+current.maps[i].digits)}</text>`}
function selectChartPoint(e){if(readMode!=='point')return;const r=$('trend').getBoundingClientRect();pointIndex=Math.max(0,Math.min(samples.length-1,Math.round(((e.clientX-r.left)/r.width*960-40)/900*(samples.length-1))));selectionPinned=true;updateRead()}
let pendingFill=null;
function fillData(){if(!connected||!samples.length){toast('暂无可填入数据，请先连接并读取');return}const active=activeFields(),existing=active.filter(i=>$('value'+i).value!=='');pendingFill={values:[...selectedValues()],active,selection:$('selectionNote').textContent,mode:readMode==='average'?'时段平均值':readMode==='point'?'指定时间点值':'最新值'};if(existing.length){$('fillMessage').textContent='以下字段已有数值，确认后将覆盖：'+existing.map(i=>fields[i][0]).join('、')+'。';$('fillSummary').textContent=pendingFill.selection+' · 共 '+active.length+' 项数据';$('fillOverlay').hidden=false}else commitFill()}
function cancelFill(){pendingFill=null;$('fillOverlay').hidden=true}
function commitFill(){if(!pendingFill)return;const {values,active,selection,mode}=pendingFill;active.forEach(i=>{const input=$('value'+i);input.value=values[i].toFixed(+current.maps[i].digits);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))});$('importNote').textContent='✓ 已从PLC导入 '+active.length+' 项 · '+mode+' · '+selection+' · PLC已断开';$('importNote').hidden=false;closePLC();go('test');toast('数据已填入，PLC连接已断开')}
function closePLC(){cancelFill();connectAttempt++;clearInterval(timer);connected=false;samples=[];$('overlay').hidden=true;closeHistory()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('fillOverlay').hidden)cancelFill();else if(!$('historyOverlay').hidden)closeHistory();else closePLC()}});renderRecords();

</script></html>
